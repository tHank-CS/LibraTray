name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Windows
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        shell: pwsh
        run: ./scripts/restore.ps1 -Locked

      - name: Verify formatting, build, tests, and dependency audit
        shell: pwsh
        run: ./scripts/verify.ps1 -SkipRestore

      - name: Build and verify release packages
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version 0.0.0 -Locked

      - name: Upload test report
        if: ${{ always() && hashFiles('TestResults/**/*.trx') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results
          path: TestResults/
          if-no-files-found: error
          retention-days: 14
