name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release on Windows
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw 'Release tags must match vMAJOR.MINOR.PATCH.'
          }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Restore locked dependencies
        shell: pwsh
        run: ./scripts/restore.ps1 -Locked

      - name: Verify formatting, build, tests, and dependency audit
        shell: pwsh
        run: ./scripts/verify.ps1 -SkipRestore

      - name: Build and verify release assets
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version '${{ steps.version.outputs.value }}' -Locked

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LibraTray-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/release/${{ steps.version.outputs.value }}/*.zip
            artifacts/release/${{ steps.version.outputs.value }}/*.msi
            artifacts/release/${{ steps.version.outputs.value }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $assetRoot = "artifacts/release/$version"
          $releaseNotesPath = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "Missing reviewed release notes: $releaseNotesPath"
          }
          $releaseNotes = Get-Content -LiteralPath $releaseNotesPath -Raw
          $warning = @'
          ## Downloads

          - `LibraTray-VERSION-win-x64.zip`: self-contained portable build.
          - `LibraTray-VERSION-win-x64.msi`: current-user installer; no administrator permission is required.
          - `SHA256SUMS.txt`: SHA-256 checksums for both packages.

          These artifacts are not code-signed. Windows may display SmartScreen or unknown-publisher warnings. Verify the SHA-256 checksum before running a download.

          This draft was created automatically and must be reviewed before publication.
          '@
          $warning = $warning.Replace('VERSION', $version)
          $notes = "$($releaseNotes.Trim())`n`n$($warning.Trim())"
          gh release create '${{ github.ref_name }}' `
            "$assetRoot/LibraTray-$version-win-x64.zip" `
            "$assetRoot/LibraTray-$version-win-x64.msi" `
            "$assetRoot/SHA256SUMS.txt" `
            --repo '${{ github.repository }}' `
            --verify-tag `
            --draft `
            --generate-notes `
            --notes $notes
